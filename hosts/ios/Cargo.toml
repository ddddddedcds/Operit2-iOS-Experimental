[package]
name = "operit-host-ios-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
operit-host-api = { path = "../../core/crates/operit-host-api" }
operit-host-apple-native = { path = "../apple" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
plist = "1"

[[bin]]
name = "operit_agent_daemon"
path = "src/bin/operit_agent_daemon.rs"
